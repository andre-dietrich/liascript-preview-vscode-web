on:
  push:
    tags:
      - "*"

name: Create Release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Building Package
        env:
          # packaging needs no browser; Playwright's Chromium download fails on new runner images
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install -g @vscode/vsce
          npm install
          npm run pack
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "./liascript-preview-web-$TAG.vsix" \
            --title "Release $TAG" \
            --notes "Download the liascript-preview below ..."
